services:
  - type: web
    name: orbit-tasks
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --ignore-scripts --no-audit --no-fund && npm run build && npm prune --omit=dev --ignore-scripts
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: DATABASE_URL
        fromDatabase:
          name: orbit-tasks-db
          property: connectionString
      - key: APP_ORIGIN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPERATOR_WALLET_ADDRESS
        sync: false
      - key: WORKER_PAYOUT_ADDRESS
        sync: false
      - key: REVIEWER_PAYOUT_ADDRESS
        sync: false
      - key: PROGRAM_ID
        sync: false
      - key: WORKER_MODEL
        value: cohere/north-mini-code:free
      - key: REVIEWER_MODEL
        value: cohere/north-mini-code:free
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
databases:
  - name: orbit-tasks-db
    plan: free
    region: singapore
    databaseName: orbit_tasks
    user: orbit_tasks
    ipAllowList: []
